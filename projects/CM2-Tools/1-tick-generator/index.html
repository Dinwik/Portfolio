<!DOCTYPE html>
<html lang="pl">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>CM2 XAND Generator</title>
        <link rel="icon" type="image/svg" href="../../../assets/icon.svg">
        <link rel="stylesheet" href="../../../assets/style.css">
    </head>
    <body>
        <header class="options">
            <div class="option">
                <a href="../../../"><h2>Home</h2></a>
            </div>
            <div class="option">
                <h1>CM2 XAND Generator</h1>
            </div>
            <div class="option">
                <h2 id="last_update"></h2>
            </div>
        </header>
        <main class="container">
            <article class="item">     
                <a href="../">Return</a>

                <textarea rows="15" id="input" tabfix="true"># text between hashes is comment #
# operations (in order): (), (!, ~, NOT), (&, *, AND), NAND, (^, XOR), (|, +, OR), NOR, =, : #
# '=' sets output value to the right side expression #
# ':' sets a temporary variable to the right side expression (not visible in final XAND) #
# semicolon must be put after each line of code #

# example program for a 2-bit adder #

# this forces the inputs to be in that order#
cin; a0; a1; b0; b1;

s0 = a0^b0^cin;
c1: a0&b0 | a0&cin | b0&cin;

s1 = a1^b1^c1;
carryout = a1&b1 | a1&c1 | b1&c1;</textarea>

                <button onclick="copyString()">Click to copy CM2 string</button>
                <div id="copyfail"></div>

                <label>
                    Order of operations:
                    <ol>
                        <li>()</li>
                        <li>! / ~ / NOT</li>
                        <li>& / * / AND</li>
                        <li>NAND</li>
                        <li>^ / XOR</li>
                        <li>XNOR</li>
                        <li>| / + / OR</li>
                        <li>NOR</li>
                        <li>= / :</li>
                    </ol>
                </label>

                <div id="output"></div>
            </article>
        </main>

        <script>
            let input = document.getElementById("input")

            function copyString() {
                expression = input.value;

                let xand = new XAND(expression);
                let circuit = xand.generateAndGetCircuit().getString();
                console.log(circuit);
                copy(circuit);
            }
        </script>
        <script src="../js/cm2.js"></script>
        <script src="../js/copy.js"></script>
        <script src="../text-generator/text.js"></script>
        <script src="generator.js"></script>
        <script src="../../../assets/misc.js"></script>
    </body>
</html>
